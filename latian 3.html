<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan Array Objek – Data Mahasiswa</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; color: #1c2a28; }
    h1 { margin-bottom: 4px; }
    .toolbar, .info { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
    .info p { margin: 0; padding: 8px 12px; background: #e3f0ec; border-radius: 8px; }
    button, select, input { font: inherit; padding: 8px 10px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #0d5748; color: #fff; }
    td.angka { text-align: right; }
    tr.tertinggi { background: #fff3cd; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 8px; }
    .error { color: #b3261e; font-weight: 600; min-height: 1.4em; margin: 6px 0 0; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Data Mahasiswa</h1>

  <!-- Statistik (hasil method array) -->
  <div class="info">
    <p id="info-tertinggi">Nilai tertinggi: -</p>
    <p id="info-rata">Rata-rata: -</p>
    <p id="info-jumlah">Jumlah: 0</p>
  </div>

  <!-- Filter & Sort -->
  <div class="toolbar">
    <button type="button" id="btn-semua">Tampilkan Semua</button>
    <button type="button" id="btn-diatas">Di Atas Rata-rata</button>
    <label for="urut">Urutkan nama:</label>
    <select id="urut">
      <option value="">(tanpa urutan)</option>
      <option value="asc">A → Z (ascending)</option>
      <option value="desc">Z → A (descending)</option>
    </select>
  </div>

  <!-- Tabel -->
  <table>
    <thead>
      <tr><th>No</th><th>Nama</th><th>NIM</th><th>Jurusan</th><th>Nilai</th><th>Aksi</th></tr>
    </thead>
    <tbody id="isi-tabel"></tbody>
  </table>

  <!-- Form Create / Update -->
  <fieldset>
    <legend id="judul-form">Tambah Mahasiswa</legend>
    <form id="form-mhs" novalidate autocomplete="off">
      <input id="nama" placeholder="Nama (min. 3 huruf)" aria-label="Nama">
      <input id="nim" placeholder="NIM" aria-label="NIM">
      <input id="jurusan" placeholder="Jurusan" aria-label="Jurusan">
      <input id="nilai" type="number" min="0" max="100" placeholder="Nilai 0-100" aria-label="Nilai">
      <button type="submit" id="btn-simpan">Simpan</button>
      <button type="button" id="btn-batal" hidden>Batal edit</button>
    </form>
    <p class="error" id="pesan-error" aria-live="polite"></p>
  </fieldset>

  <script>
    /* ============ DATA: array berisi objek mahasiswa ============ */
    let mahasiswa = [
      { id: 1, nama: "Budi Santoso",   nim: "124140001", jurusan: "Teknik Informatika", nilai: 85 },
      { id: 2, nama: "Citra Lestari",  nim: "124140002", jurusan: "Sistem Informasi",   nilai: 72 },
      { id: 3, nama: "Andi Pratama",   nim: "124140003", jurusan: "Teknik Informatika", nilai: 90 },
      { id: 4, nama: "Dewi Anggraini", nim: "124140004", jurusan: "Teknik Elektro",     nilai: 65 },
      { id: 5, nama: "Eko Wijaya",     nim: "124140005", jurusan: "Sains Data",         nilai: 78 }
    ];
    let idBerikut = 6;

    /* ============ STATE TAMPILAN ============ */
    let modeTampil = "semua";   
    let arahUrut = "";          
    let idSedangEdit = null;    

    // Menampilkan isi array mahasiswa ke dalam tabel HTML
    function tampilkanMahasiswa() {
      const isiTabel = document.getElementById("isi-tabel");

      isiTabel.innerHTML = mahasiswa.map((mhs, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${mhs.nama}</td>
          <td>${mhs.nim}</td>
          <td>${mhs.jurusan}</td>
          <td class="angka">${mhs.nilai}</td>
          <td>-</td>
        </tr>
      `).join("");

      document.getElementById("info-jumlah").textContent =
        `Jumlah: ${mahasiswa.length}`;
    }

    // Jalankan saat halaman selesai dimuat
    tampilkanMahasiswa();
  </script>
</body>
</html>
